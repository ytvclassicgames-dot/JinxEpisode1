<script src="https://unpkg.com/@ruffle-rs/ruffle@0.1.0-nightly.2024.7.12/ruffle.js"></script>

<style>
    :root { 
        --player-width: 100%; 
        --player-height: 400px; 
        --btn-default: #2A3A8C; 
        --btn-glow: #FF0000; 
    }

    #flash-container {
        width: var(--player-width); 
        height: var(--player-height);
        outline: none; 
        overflow: hidden; 
        display: flex;
        justify-content: center; 
        background: #000;
        user-select: none; 
        -webkit-user-select: none;
    }

    ruffle-player { width: 100%; height: 100%; object-fit: contain; }

    #controls-container {
        display: grid; 
        grid-template-areas: 
            ". up ." 
            "left down right" 
            "space space space";
        grid-template-columns: 1fr 1fr 1fr;
        gap: 6px; 
        width: 180px; 
        margin: 15px auto;
        touch-action: none; 
        -webkit-tap-highlight-color: transparent;
    }

    .btn {
        background-color: var(--btn-default); 
        color: white; 
        border: none; 
        border-radius: 6px;
        height: 45px; 
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold; 
        font-family: sans-serif;
        font-size: 1.1rem;
        touch-action: none; 
        cursor: pointer;
        box-shadow: 0 3px #1a2456; 
        transition: all 0.05s ease;
    }

    .btn:active, .btn.is-active { 
        background-color: var(--btn-glow) !important; 
        color: #FFFFFF; 
        transform: translateY(2px);
        box-shadow: 0 0 12px 2px rgba(255, 0, 0, 0.65); 
        text-shadow: 0 0 5px rgba(255, 255, 255, 0.7);
        z-index: 10;
    }

    .up { grid-area: up; } 
    .left { grid-area: left; } 
    .down { grid-area: down; } 
    .right { grid-area: right; }
    .space { grid-area: space; font-size: 0.8rem; }
</style>

<div id="flash-container" tabindex="0"></div>

<div id="controls-container">
    <button class="btn up" id="btn-38">↑</button>
    <button class="btn left" id="btn-37">←</button>
    <button class="btn down" id="btn-40">↓</button>
    <button class="btn right" id="btn-39">→</button>
    <button class="btn space" id="btn-32">SPACEBAR</button>
</div>

<script>
    window.RufflePlayer = window.RufflePlayer || {};
    let player;
    const keyMap = { 37: "ArrowLeft", 38: "ArrowUp", 39: "ArrowRight", 40: "ArrowDown", 32: " " };
    let activeKeys = {}; 

    window.addEventListener("load", () => {
        const ruffle = window.RufflePlayer.newest();
        player = ruffle.createPlayer();
        player.config = { 
            letterbox: "on", 
            autoplay: "on", 
            unmuteOverlay: "hidden",
            backgroundColor: "#000000"
        };
        document.getElementById("flash-container").appendChild(player);
        player.load("https://static.wixstatic.com/media/3fa2c7_ac146764bb6348dc9efe694803af58ee.swf");
        setupControls();
    });

    function setupControls() {
        const buttons = document.querySelectorAll('.btn');
        buttons.forEach(button => {
            const keyCode = parseInt(button.id.replace('btn-', ''));
            button.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                releaseAll(); 
                sendKey(keyCode);
                button.classList.add('is-active');
            });
        });
    }

    function sendKey(code) {
        if (activeKeys[code]) return;
        const internalPlayer = document.querySelector("ruffle-player");
        if (internalPlayer) {
            internalPlayer.focus();
            activeKeys[code] = true;
            internalPlayer.dispatchEvent(new KeyboardEvent('keydown', { keyCode: code, key: keyMap[code], bubbles: true }));
        }
    }

    function releaseKey(code) {
        if (!activeKeys[code]) return;
        const internalPlayer = document.querySelector("ruffle-player");
        if (internalPlayer) {
            delete activeKeys[code];
            internalPlayer.dispatchEvent(new KeyboardEvent('keyup', { keyCode: code, key: keyMap[code], bubbles: true }));
            const btn = document.getElementById('btn-' + code);
            if (btn) btn.classList.remove('is-active');
        }
    }

    function releaseAll() {
        Object.keys(activeKeys).forEach(code => releaseKey(parseInt(code)));
    }

    ["pointerup", "pointercancel", "pointerleave", "blur"].forEach(evt => {
        window.addEventListener(evt, () => releaseAll());
    });
</script>
